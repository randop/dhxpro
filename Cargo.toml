[package]
name = "dhxpro"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
description = "Static ARM musl DHCPv4 server using io_uring and FeOxDB"

[lib]
name = "dhxpro"
path = "src/lib.rs"

[[bin]]
name = "dhxpro"
path = "src/main.rs"

[dependencies]
# Pin feoxdb 0.6.0 with jemalloc off. In this release `io_uring`, `persistent`,
# and `system-alloc` are marker features: Linux builds always compile the
# io-uring crate, persistence is selected by device_path, and leaving the
# default jemalloc feature disabled selects the system allocator.
feoxdb = { version = "=0.6.0", default-features = false, features = ["io_uring", "persistent", "system-alloc"] }
io-uring = "=0.7.15"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ipnet = "2"
libc = "0.2"
rand = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

# fix error[E0080]: attempt to compute 4_usize * 1073741824_usize, which would overflow
[patch.crates-io]
feoxdb = { path = "patches/feoxdb" }
